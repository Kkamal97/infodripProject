<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netskope DLP Test - infodrip.in</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="card">
        <h2>File Upload DLP Test</h2>
        <p class="subtitle">Testing outbound HTTP POST request to <strong>infodrip.in</strong></p>
        
        <form id="uploadForm">
            <div class="drop-zone" id="dropZone">
                <span class="drop-zone-text">Choose a file or drag & drop here</span>
                <input type="file" id="fileInput" required>
            </div>
            
            <div id="fileDetails" class="file-details">
                Selected: <span id="fileName"></span>
            </div>

            <button type="submit" id="uploadBtn">Upload File</button>
        </form>

        <div id="status" class="status-box"></div>
    </div>

    <script src="app.js"></script>
</body>
</html>
